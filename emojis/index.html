<!DOCTYPE html>
<html lang="en-US">
	<head>
		<title>PenguinMod - Library</title>
		<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
		<style>
            @keyframes spinner {
                0% { transform: rotate(0deg); }
                50% { transform: rotate(180deg); }
                100% { transform: rotate(360deg); }
            }

			* {
				font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
			}
            code {
                font-family: monospace;
                background: rgba(0, 0, 0, 0.1);
                border-radius: 4px;
            }
			body {
				min-width: 400px;
				font-family: 'Lilita One Rus', sans-serif;  
		    	letter-spacing: 2px; 
			}

			.nav-bar {
				position: absolute;
				left: 0;
				top: 0;
				width: 100%;
				height: 3rem;
				background: linear-gradient(0deg,rgba(255, 0, 0, 1) 0%, rgba(34, 0, 255, 1) 50%, rgba(255, 255, 255, 1) 100%);
				display: flex;
				flex-direction: row;
				align-items: center;
			}

			.nav-bar a:not(.home-redirect) {
				margin: 0 8px;
				height: 100%;
			}
			.nav-bar button {
				height: 100%;
				padding: 8px 12px;
				background: transparent;
				color: white;
				font-weight: bold;
				font-size: 0.75rem;
				border: 0;
				margin: 0;
				cursor: pointer;
				font-family: 'Lilita One Rus', sans-serif;  
		    	letter-spacing: 2px; 
			}
			.nav-bar button:hover {
				background: rgba(0, 0, 0, 0.125);
			}
			
			.home-redirect {
				height: 80%;
				margin-left: 4px;
			}
			.home-redirect > img {
				height: 100%;
			}

			.nav-margin {
				width: 100%;
				height: 3rem;
			}

            .loading {
                animation: spinner 1s linear 0s infinite;
                width: 4rem;
            }
            .error {
                color: red;
            }

            .emoji-card {
                margin: 4px;
                padding: 4px;
                border-radius: 4px;
                border: 1px solid rgba(0, 0, 0, 0.25);
                background: white;
                display: flex;
                flex-direction: column;
                align-items: center;
                cursor: pointer;
                width: 172px;
                height: 150px;
            }
            .emoji-card > img {
                width: 96px;
                height: 96px;
            }
            .emoji-card > p {
                font-weight: bold;
                margin-block: 4px;
            }
            .emoji-card:active {
                filter: brightness(0.8);
            }
            .emoji-container {
                display: flex;
                flex-direction: row;
                flex-wrap: wrap;
            }
		</style>
	</head>
	<body>
		<div class="nav-bar">
			<a class="home-redirect" href="https://penguinmod.com">
				<img src="navicon.png" alt="Icon">
			</a>
			<a href="./">
				<button>
					На Главную
				</button>
			</a>
			<a href="https://github.com/orengdog/PenguinMod-ObjectLibraries/tree/main/files">
				<button>
					Файлы Github
				</button>
			</a>
			<a href="https://gitverse.ru/orengdog/RussianWhiteBearMod-ObjectLibraries/content/main/files">
				<button>
					Файлы Gitverse
				</button>
			</a>
			<a href="./emojis">
				<button>
					Эмодзи
				</button>
			</a>
			<a href="https://github.com/orengdog/PenguinMod-ObjectLibraries/tree/main">
				<button>
					GitHub
				</button>
			</a>
			<a href="https://gitverse.ru/orengdog/RussianWhiteBearMod-ObjectLibraries">
				<button>
					Gitverse
				</button>
			</a>
		</div>
		<div class="nav-margin"></div>
		<h1>PenguinMod Emojis</h1>
        <p>These are accessible by surrounding a <strong>lower-case emoji name</strong> with colon : symbols.</p>
        <p>Examples:</p>
        <p style="margin-left:8px;"><code>:excited: :meh: :idk:</code></p>
        <br>
        <p>You can use these in your project's description. Click on an emoji to copy it.</p>
        <img id="loading" class="loading" src="https://penguinmod.com/loading.png" alt="Loading">
        <p id="error" class="error" style="display: none;">An error occurred. You may need to try again later.</p>
        <div class="emoji-container" id="container"></div>
        
        <script>
            const loadingSpinner = document.getElementById('loading');
            const errorText = document.getElementById('error');
            const emojiContainer = document.getElementById('container');
            const emojiHtmlUrl = 'https://gextapi.derpygamer2142.com/emojis';

            const emojiElementHTML = `<button class="emoji-card" onclick="copyEmojiName(\`{NAME}\`)">
    <img src="../files/emojis/{NAME}.png" alt=":{NAME}:" title=":{NAME}:" loading="lazy">
    <p>:{NAME}:</p>
</button>`;

            const copyEmojiName = (name) => {
                navigator.clipboard.writeText(`:${name}:`);
            };

            (async () => {
                const response = await fetch(emojiHtmlUrl);
                const emojis = await response.json();
                
                loadingSpinner.remove();
                for (const emoji of emojis) {
                    emojiContainer.innerHTML += emojiElementHTML.replace(/\{NAME\}/gm, emoji);
                }
            })().catch(err => {
                loadingSpinner.remove();
                errorText.style = "";
                console.error(err);
            });
        </script>
	</body>
</html>
